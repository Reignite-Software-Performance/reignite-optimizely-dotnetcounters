name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [net472, net6.0]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Reignite.Optimizely.DotNetCounters.sln

      - name: Build net472 (Optimizely V11)
        if: matrix.config == 'net472'
        run: |
          # msbuild is not on PATH on GitHub-hosted runners (it lives inside the VS Build Tools
          # instance, reachable only through vswhere), so this step failed on every run. The .NET
          # SDK can build net472 directly when the targeting pack is installed, which it is.
          dotnet build Reignite.Optimizely.DotNetCounters.sln -c Release -f net472

      - name: Build net6.0 (Optimizely V12)
        if: matrix.config == 'net6.0'
        run: |
          dotnet build Reignite.Optimizely.DotNetCounters.sln -c Release

      - name: Run unit tests (net6.0)
        if: matrix.config == 'net6.0'
        run: |
          dotnet test -c Release
