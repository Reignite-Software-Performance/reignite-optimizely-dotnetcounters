  ## What to do

  1. **Reproduce it with a FAILING test before changing anything.**
     This is the first task, not a formality. A fix may only ship unattended
     when it carries red-green proof — a test that demonstrably FAILED at the
     parent commit and PASSES at the fix. Writing the test first is what makes
     that provable; writing it afterwards proves nothing, because a test that
     never failed says nothing about the defect.
  2. Trace from the stack and evidence above to the code path that throws.
  3. Fix the CAUSE. A null-guard that hides the symptom leaves the defect and
     removes the signal that would have found it — the exception stops being
     reported while the wrong behaviour continues.
  4. Keep the reproducing test. It is the regression guard AND the red-green
     evidence.

  ## If you cannot reproduce it

  Say so explicitly in this feature's description and set the status to
  `needs-investigation` rather than guessing at a fix. An unreproducible defect
  that gets
  a speculative change is worse than one left open — the change ships without
  evidence, and the next occurrence looks like a NEW defect because the
  speculative fix altered the signature. Record what you tried and what
  evidence would be needed.

